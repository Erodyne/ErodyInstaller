name: Build e release

on:
  push:
    tags: ['v*']
  release:
    types: [published]   # release creata dal sito di GitHub: compila e allega l'exe
  workflow_dispatch:
    inputs:
      versione: { description: 'Versione da pubblicare (es. 1.0.0); vuoto = solo compilazione', required: false, default: '' }
      firma: { description: 'Firma Erodyne Base64 da allegare alla release v<versione>', required: false, default: '' }

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allega la firma
        if: inputs.firma != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMA: ${{ inputs.firma }}
          VER: ${{ inputs.versione }}
        shell: pwsh
        run: |
          if ($env:FIRMA -notmatch '^[A-Za-z0-9+/=]+$' -or $env:VER -notmatch '^\d+(\.\d+)*$') { throw 'dati non validi' }
          Set-Content "ErodyInstaller-Setup-$env:VER.exe.sig" $env:FIRMA -Encoding ascii -NoNewline
          gh release upload "v$env:VER" "ErodyInstaller-Setup-$env:VER.exe.sig" --clobber
      - name: Compila ErodyInstaller
        if: inputs.firma == '' 
        shell: pwsh
        run: |
          $v = "${{ inputs.versione }}"; if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+(\.\d+)*$') { $v = 'dev' }
          $out = "ErodyInstaller-Setup-$v.exe"
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:$out /win32icon:ErodyInstaller.ico /win32manifest:app.manifest `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.Web.Extensions.dll /r:Microsoft.VisualBasic.dll src\*.cs
          if (-not (Test-Path $out)) { throw 'Compilazione non riuscita' }
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  $out" | Set-Content "$out.sha256" -Encoding ascii
          "OUT=$out" | Out-File $env:GITHUB_ENV -Append
      - name: Pubblica la release
        if: inputs.firma == '' && (startsWith(github.ref, 'refs/tags/') || inputs.versione != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.versione }}") { "v${{ inputs.versione }}" } else { "${{ github.ref_name }}" }
          (Get-Content "$env:OUT.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $env:OUT "$env:OUT.sha256" --clobber }
          else { gh release create $tag $env:OUT "$env:OUT.sha256" --target ${{ github.sha }} --title "ErodyInstaller $tag" --generate-notes }
      - uses: actions/upload-artifact@v4
        if: inputs.firma == '' 
        with: { name: ErodyInstaller, path: 'ErodyInstaller-Setup-*' }
